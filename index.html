<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leepang 2 Daily Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: toolbar above a fixed-width report poster (480px, scaled to fit) with the figures editor beside it on wide screens and below it on phones. */
:root{
  --bg:#edf1ea; --fg:#15281b; --muted:#566a5b; --panel:#ffffff; --field:#f5f8f3;
  --line:#d0dacc; --accent:#1e6b35; --accent-ink:#ffffff; --danger:#a3380f;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1913; --fg:#e3eee5; --muted:#94a99a; --panel:#16231b; --field:#0f1913;
    --line:#2a3c30; --accent:#7fd08f; --accent-ink:#0b1a10; --danger:#ff9a76; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1913; --fg:#e3eee5; --muted:#94a99a; --panel:#16231b; --field:#0f1913;
  --line:#2a3c30; --accent:#7fd08f; --accent-ink:#0b1a10; --danger:#ff9a76; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
.app{max-width:1180px;margin:0 auto;padding-block:18px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.brand{display:grid;margin-right:auto;min-width:0}
.brand strong{font:800 22px/1.1 var(--font-display);letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{font:600 14px var(--font-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.fld input:focus-visible,.fld textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{font-size:13px;color:var(--muted);min-height:1em}
.status.err{color:var(--danger)}

/* page layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.stage{width:100%;max-width:600px;margin-inline:auto;overflow:hidden;border:1px solid var(--line);position:relative}
.scaler{width:480px;transform-origin:top left}
@media (min-width:960px){
  .layout.editing{grid-template-columns:minmax(0,600px) minmax(0,1fr)}
  .layout.editing .stage{margin-inline:0}
}

/* editor */
.editor{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ed-head h2{margin:0;font:800 20px var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.note{margin:6px 0 4px;color:var(--muted);font-size:13px}
.grp{margin-top:16px}
.grp h3{margin:0 0 8px;font:700 13px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.grp h3 i{width:10px;height:10px;border-radius:3px;background:var(--dot,var(--accent));display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:13px;font-weight:600}
.inp{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:8px;padding-right:10px}
.inp:focus-within{border-color:var(--accent)}
.inp input,.fld textarea{font:500 16px var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg);background:transparent;
  border:0;padding:9px 10px;width:100%;min-width:0;border-radius:8px}
.inp input:focus-visible{outline:none}
.inp em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.fld textarea{background:var(--field);border:1px solid var(--line);resize:vertical;min-height:72px}
.fld input[type=date]{background:var(--field);border:1px solid var(--line);border-radius:8px;max-width:220px}
.pnl{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:18px;min-width:0}
.pnl-h h3{margin:0;font:800 18px var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.pnl-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pnl.daily{border:2px solid var(--accent);margin-top:14px}
.pnl.fold{margin-top:12px}
.pnl.auto{background:var(--field);border-style:dashed}
.pnl.auto .inp{background:var(--panel);border-style:dashed}
.pnl.auto>.grid{margin-top:14px}
.pnl.auto>.note{margin:10px 0 0}
.pnl.setup>.grid{margin-top:14px}
.dbody{margin-top:4px}
.gg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
.gg.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}
.gc2{border:1px solid var(--line);border-left:5px solid var(--dot,var(--accent));border-radius:10px;padding:10px 12px 12px;margin-top:12px}
.gc2 h4{margin:0 0 8px;font:700 15px var(--font-body);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gc2.sum{background:var(--field);border-style:dashed;border-left-style:solid}
.gc2.sum .ro b{padding:7px 8px;font-size:15px}
.gc2 .note{margin:8px 0 0}
.fld.sm>span{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2;min-height:2.4em;display:flex;align-items:flex-end}
.fld.sm .inp{padding-right:0}.fld.sm .inp input{padding:8px 8px}
.gc2 .ro>span{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2;min-height:2.4em;display:flex;align-items:flex-end}
@media (max-width:380px){.gg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fold>summary{cursor:pointer;list-style:none;position:relative;padding-right:28px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";position:absolute;right:6px;top:8px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.fold[open]>summary::after{transform:rotate(-135deg);top:12px}
.fold>summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}
.fold[open]>summary{margin-bottom:14px}
.tag{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;white-space:nowrap}
.ro{display:grid;gap:4px;min-width:0}
.ro>span{font-size:13px;font-weight:600}
.ro b{display:block;padding:9px 10px;border:1px dashed var(--line);border-radius:8px;font:600 16px var(--font-body);font-variant-numeric:tabular-nums;background:var(--panel)}

/* the report poster: fixed palette so it looks the same in light and dark and exports the same */
.report{width:480px;background:#f6f8f2;color:#14301f;font-family:var(--font-body);position:relative;overflow:hidden}
.report *{box-sizing:border-box}
.r-head{position:relative;z-index:2;height:100px;background:linear-gradient(180deg,#0f4d2a,#0c4223);display:flex;align-items:center;justify-content:center;padding:0 96px 6px;text-align:center}
.r-title{margin:0;font:800 29px/1.04 var(--font-display);letter-spacing:.01em;text-transform:uppercase;color:#fff}
.r-frond{position:absolute;left:0;top:0;width:100px;height:96px}
.r-bunch{position:absolute;right:12px;top:8px;width:80px;height:64px}
.r-date{position:absolute;right:18px;bottom:-17px;background:#f6c93a;color:#14301f;font:800 21px/1 var(--font-display);
  padding:7px 16px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap}
.r-kpis{display:grid;grid-template-columns:repeat(6,1fr);row-gap:8px;background:#bfe8c8;padding:32px 6px 12px;border-radius:0 0 18px 18px}
.kpi{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:0 4px;border-left:1px solid rgba(20,48,31,.22)}
.kpi.k2{grid-column:span 3}.kpi.k3{grid-column:span 2}
.kpi:nth-child(1),.kpi:nth-child(3){border-left:0}
.kpi:nth-child(n+3){border-top:1px solid rgba(20,48,31,.22);padding-top:8px}
.kpi.k2 .kv{font-size:22px}
.kpi svg{width:38px;height:38px}
.kl{font-weight:700;font-size:15px;color:#17375a;margin-top:2px}
.kv{font:800 19px/1.1 var(--font-body);font-variant-numeric:tabular-nums;color:#14301f;white-space:nowrap}
.kb{font-size:12px;font-weight:600;color:#3d5a45;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.kd{font-size:12.5px;font-weight:800;line-height:1.3;color:#fff;background:#1f8a3b;border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kd.neg{background:#c0392b}.kd.zero{background:#5b6f62}
.r-gangs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 0}
.gc{background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 1px 6px rgba(20,48,31,.2)}
.gh{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;color:#fff;font:800 19px var(--font-display);white-space:nowrap}
.gb{position:relative;padding:6px 10px 8px}
.gr{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:27px;font-size:14.5px;white-space:nowrap}
.gr svg{flex:none}
.gl{width:68px;flex:none}
.gv{font-weight:700;font-variant-numeric:tabular-nums}
.gf{position:absolute;right:4px;opacity:.5;z-index:0}
.gf.t{top:2px}.gf.b{bottom:4px}
.gc.wide{grid-column:1/-1}
.gc.wide .gb{display:grid;grid-template-rows:repeat(3,27px);grid-auto-flow:column;grid-template-columns:1fr 1fr;column-gap:16px}
.r-rain{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:8px 14px;background:#1a63c9;color:#fff;border-radius:10px}
.rt{font:800 20px var(--font-display);margin-right:auto}
.rc{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:62px}
.rc small{font-size:12px;font-weight:600;opacity:.9}
.rc b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-rem{display:flex;align-items:center;gap:10px;margin:8px 16px 0;padding:10px 14px;background:#f6c93a;border-radius:10px}
.rl{font-weight:800;font-size:16px}
.r-rem i{width:1px;align-self:stretch;background:rgba(20,48,31,.4)}
.rv{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.r-foot{position:relative;margin-top:14px;height:92px;background:linear-gradient(180deg,#3d6f38,#133a1c);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
.r-foot::before{content:"";position:absolute;left:0;right:0;bottom:0;top:0;clip-path:polygon(45% 100%,55% 100%,62% 34%,38% 34%);background:rgba(223,203,160,.55)}
.r-foot span{position:relative;background:#f6f8f2;color:#14501f;font-weight:800;font-size:17px;padding:6px 22px;border-radius:999px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.login{max-width:380px;margin:40px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.login h2{margin:0 0 4px;font:800 22px var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.login form{display:grid;gap:12px;margin-top:14px}
.login .btn{justify-self:start}
.login-msg{min-height:1.2em;margin:0;font-size:13px;color:var(--danger)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
</style>
</head>
<body>
<main class="app">
  <div class="bar">
    <div class="brand"><strong>Leepang 2 Estate</strong><span>Daily productivity report</span></div>
    <div class="tools">
      <label class="sr" for="hist">Saved reports</label>
      <select id="hist" class="btn"></select>
      <button id="btn-edit" class="btn primary" type="button" aria-expanded="false" aria-controls="editor" hidden>Edit figures</button>
      <button id="btn-new" class="btn" type="button" hidden>New day</button>
      <button id="btn-img" class="btn" type="button" hidden>Save as image</button>
      <button id="btn-out" class="btn" type="button" hidden>Sign out</button>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </div>
  </div>

  <section id="login" class="login" hidden>
    <h2>Sign in</h2>
    <p class="note">Sign in to see and save the Leepang 2 reports on this device.</p>
    <form id="login-form">
      <label class="fld" for="login-email"><span>Email</span><div class="inp"><input id="login-email" type="email" autocomplete="username" required></div></label>
      <label class="fld" for="login-pass"><span>Password</span><div class="inp"><input id="login-pass" type="password" autocomplete="current-password" required></div></label>
      <p id="login-msg" class="login-msg" role="alert"></p>
      <button id="login-go" class="btn primary" type="submit">Sign in</button>
    </form>
  </section>

  <div id="layout" class="layout">
    <section id="stage" class="stage" aria-label="Report preview">
      <div id="scaler" class="scaler"><article id="report" class="report"></article></div>
    </section>

    <aside id="editor" class="editor" hidden aria-label="Edit report figures">
      <div class="ed-head"><h2>Report figures</h2><button id="btn-save" class="btn" type="button">Save</button></div>
      <p class="note">Type the number only. Units are added on the report. Write Nil where there is none. Changes save by themselves.</p>
      <div id="ed-body"></div>
    </aside>
  </div>
</main>

<script>
/* ---------- data ---------- */
const DEFAULT = {
  date: '2026-11-02',
  crop: { ha: '', tdy: '', mth: '', yFyBase: '', bYMth: '', bYFy: '' },
  gangs: {
    pm20:  { outturn: '', yield: '', unripe: '', interval: '', backlog: '', loose: '' },
    pm16:  { outturn: '', yield: '', unripe: '', interval: '', backlog: '', loose: '' },
    pm96:  { outturn: '', yield: '', unripe: '', interval: '', backlog: '', loose: '' },
    pm23:  { outturn: '', yield: '', unripe: '', interval: '', backlog: '', loose: '' },
    all:   { outturn: '', yield: '', unripe: '', interval: '', backlog: '', loose: '' }
  },
  rain: { tdy: '', mtd: '', ytd: '' },
  remarks: ''
};
const CROPS = [
  { k: 'tdy', label: 'Today Crop',        icon: 'scale' },
  { k: 'mth', label: 'Todate Crop (Mth)', icon: 'bars' }
];
/* Actual yields are calculated from crop and hectarage; budget yields use the 2026/2027 monthly budget. */
const YIELDS = [
  { label: 'Today Yield',        calc: 'tdy' },
  { label: 'Todate Yield (Mth)', calc: 'mth', budget: 'bYMth' },
  { label: 'Todate Yield (FY)',  fy: true, budget: 'bYFy' }
];
const GANGS = [
  { k: 'pm20',  name: 'Gang PM20 (Albert)',    c: '#1f8a3b' },
  { k: 'pm16',  name: 'Gang PM16/17 (Basman)', c: '#1a63c9' },
  { k: 'pm96',  name: 'Gang PM96 (Masdar)',    c: '#7a4bb0' },
  { k: 'pm23',  name: 'Gang PM23 & Scout (Arif)', c: '#0f8b8d' },
  { k: 'all',   name: 'Summary All Gang',      c: '#1d6a36' }
];
const ROWS = [
  { k: 'outturn',  label: 'Outturn',     unit: '',         hint: '',        icon: 'ring',  ph: '11/16' },
  { k: 'yield',    label: 'Yield/mdy',   unit: ' mt/mdy',  hint: 'mt/mdy',  icon: 'rbars' },
  { k: 'unripe',   label: 'Unripe',      unit: '%',        hint: '%',       icon: 'warn' },
  { k: 'interval', label: 'Interval',    unit: ' days',    hint: 'days',    icon: 'cal' },
  { k: 'backlog',  label: 'Backlog',     unit: '',         hint: '',        icon: 'box',   ph: 'Nil' },
  { k: 'loose',    label: 'Loose fruit', unit: '%',        hint: '%',       icon: 'nut' }
];
const RAIN = [
  { k: 'tdy', label: 'Tdy' }, { k: 'mtd', label: 'MTD' }, { k: 'ytd', label: 'YTD' }
];
const LS = 'leepang2.reports.v1';

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const withUnit = (v, u) => { v = String(v == null ? '' : v).trim(); if (!v) return '—'; return /^-?\d+(\.\d+)?$/.test(v) ? v + u : v; };
const fmtDate = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : '—'; };
const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
const setp = (o, p, v) => { const ks = p.split('.'), l = ks.pop(); let a = o; ks.forEach(k => { a = a[k] = a[k] || {}; }); a[l] = v; };
const clone = o => JSON.parse(JSON.stringify(o));
const sig = o => { const c = Object.assign({}, o); delete c.updatedAt; return JSON.stringify(c); };
const pad = n => String(n).padStart(2, '0');

/* ---------- icons (inline, no <use>, so the image export keeps them) ---------- */
const ICON = {
  scale: '<svg viewBox="0 0 64 64" width="46" height="46"><g fill="#2f80ed" stroke="#1d5fc4" stroke-width="2"><ellipse cx="32" cy="12" rx="4" ry="7"/><ellipse cx="25" cy="17" rx="4" ry="7" transform="rotate(-35 25 17)"/><ellipse cx="39" cy="17" rx="4" ry="7" transform="rotate(35 39 17)"/><ellipse cx="32" cy="22" rx="4" ry="6"/></g><g fill="none" stroke="#1d5fc4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 31q14 4 28 0"/><path d="M14 56h36l-4-22H18z"/><path d="M24 46a8 8 0 0 1 16 0"/><path d="M32 46l4-5"/></g></svg>',
  bars: '<svg viewBox="0 0 64 64" width="46" height="46"><g fill="#1d63c9"><rect x="6" y="32" width="11" height="22" rx="1.5"/><rect x="21" y="16" width="11" height="38" rx="1.5"/><rect x="36" y="24" width="11" height="30" rx="1.5"/><rect x="51" y="8" width="8" height="46" rx="1.5"/></g><rect x="3" y="54" width="58" height="4" rx="2" fill="#1d63c9"/></svg>',
  trend: '<svg viewBox="0 0 64 64" width="46" height="46"><g fill="none" stroke="#1f9d4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 48l16-16 12 10 22-24"/><path d="M40 18h16v16"/></g></svg>',
  ring: '<svg viewBox="0 0 32 32" width="22" height="22"><circle cx="16" cy="16" r="13" fill="none" stroke="#1f9d4d" stroke-width="3"/><rect x="14.5" y="8" width="3" height="16" rx="1.5" fill="#1f9d4d"/></svg>',
  rbars: '<svg viewBox="0 0 32 32" width="22" height="22"><g fill="#1d63c9"><rect x="3" y="15" width="7" height="14" rx="1"/><rect x="12.5" y="7" width="7" height="22" rx="1"/><rect x="22" y="11" width="7" height="18" rx="1"/></g></svg>',

}
/* The Hectarage is the same for a whole month: changing it updates every saved day of that month */
async function propagateHa(date, ha) {
  const mo = date.slice(0, 7);
  for (const [k, r] of Array.from(reports.entries())) {
    if (k === date || k.slice(0, 7) !== mo || !r.crop || String(r.crop.ha == null ? '' : r.crop.ha) === String(ha == null ? '' : ha)) continue;
    const nr = clone(r);
    nr.crop.ha = ha == null ? '' : ha;
    nr.updatedAt = new Date().toISOString();
    if (db) await db.ref('reports/' + k).set(nr);
    else {
      let m = {};
      try { m = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) {}
      m[k] = nr;
      localStorage.setItem(LS, JSON.stringify(m));
    }
    reports.set(k, nr);
  }
}
async function flush() { if (dirty) { clearTimeout(timer); await save(); } }
async function switchTo(date) {
  picked = true;
  await flush();
  if (reports.has(date)) { state = clone(reports.get(date)); dirty = false; setStatus(''); }
  else { const newMonth = state.date.slice(0, 7) !== date.slice(0, 7); state = clone(state); state.date = date; state.crop = state.crop || {}; state.crop.tdy = ''; state.rain = state.rain || {}; state.rain.tdy = ''; autoTodate(state, true); dirty = false; setStatus(newMonth ? 'New month, not saved yet. Check the Hectarage for this month, then enter today\u2019s figures.' : 'New day, not saved yet. Todate figures are carried forward. Enter today\u2019s figures.'); }
  render(); syncForm(); updateHist();
}

/* ---------- loading ---------- */
function onList(snap) {
  const next = new Map(snap.docs.map(d => [d.id, d.data()]));
  reports = next;
  if (!snap.metadata.fromCache) { clearTimeout(loadTimer); if (/^Loading|Could not reach/.test($('status').textContent)) setStatus(''); }
  if (!picked && next.size) {
    picked = true; state = clone(snap.docs[0].data()); dirty = false; render(); syncForm();
  } else if (!dirty && !snap.metadata.hasPendingWrites && state.date && next.has(state.date) && !editorFocused()) {
    const n = next.get(state.date);
    if (sig(n) !== sig(state)) { state = clone(n); render(); syncForm(); }
  }
  updateHist();
}
let loadTimer = null;

/* ---------- image export ---------- */
async function exportImage() {
  const btn = $('btn-img');
  if (!window.html2canvas) { setStatus('Image export could not load.', true); return; }
  btn.disabled = true; setStatus('Preparing image…');
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await window.html2canvas($('report'), {
      scale: 1080 / 480, backgroundColor: '#f6f8f2', logging: false,
      onclone: doc => {
        const sc = doc.getElementById('scaler'), st = doc.getElementById('stage');
        if (sc) { sc.style.transform = 'none'; sc.style.width = '480px'; }
        if (st) { st.style.height = 'auto'; st.style.overflow = 'visible'; st.style.maxWidth = 'none'; st.style.border = '0'; }
      }
    });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    await dl.save({ filename: 'Leepang2-' + (state.date || 'report') + '.png', data: blob });
    setStatus('Image saved');
  } catch (e) {
    setStatus(e && e.code === 'declined' ? 'Save cancelled' : 'Could not make the image.', !(e && e.code === 'declined'));
  } finally { btn.disabled = false; }
}

/* ---------- wiring ---------- */
buildForm(); render(); syncForm(); updateHist();

$('editor').addEventListener('input', e => { const p = e.target.dataset && e.target.dataset.path; if (p) onEdit(p, e.target.value); });
$('f-date').addEventListener('change', e => { if (e.target.value) switchTo(e.target.value); });
$('hist').addEventListener('change', e => switchTo(e.target.value));
$('btn-save').addEventListener('click', () => { dirty = true; rev++; save(); });
$('btn-img').addEventListener('click', exportImage);
$('btn-edit').addEventListener('click', () => {
  const ed = $('editor'), open = ed.hidden;
  ed.hidden = !open;
  $('layout').classList.toggle('editing', open);
  $('btn-edit').setAttribute('aria-expanded', String(open));
  $('btn-edit').textContent = open ? 'Close editor' : 'Edit figures';
  syncForm(); fit();
  if (open) setTimeout(() => ed.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 50);
});
$('btn-new').addEventListener('click', async () => {
  const t = new Date(), iso = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  if (state.date === iso) { setStatus('You are already on today’s report.'); }
  else await switchTo(iso);
  if ($('editor').hidden) $('btn-edit').click();
});

/* ---------- device features, sign-in and Firebase ---------- */
dl = {
  save: async ({ filename, data }) => {
    /* on a phone, offer the share sheet first (WhatsApp etc.), otherwise download the file */
    try {
      const file = new File([data], filename, { type: data.type || 'application/octet-stream' });
      if (/android|iphone|ipad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return { status: 'saved' };
      }
    } catch (e) {
      if (e && e.name === 'AbortError') throw { code: 'declined' };
    }
    const url = URL.createObjectURL(data), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return { status: 'saved' };
  }
};

function setSignedIn(cloud, local) {
  const on = cloud || local;
  $('login').hidden = on;
  $('layout').hidden = !on;
  $('hist').hidden = !on;
  ['btn-edit', 'btn-new', 'btn-img'].forEach(id => { $(id).hidden = !on; });
  $('btn-out').hidden = !cloud;
  if (on) fit();
}
function startLocal(note) {
  db = null; setSignedIn(false, true);
  try {
    const m = JSON.parse(localStorage.getItem(LS) || '{}');
    reports = new Map(Object.entries(m));
    if (reports.size) { const latest = Array.from(reports.keys()).sort().pop(); state = clone(reports.get(latest)); picked = true; render(); syncForm(); }
  } catch (e) {}
  updateHist();
  if (note) setStatus(note);
}
let unsub = null;
function startCloud(fs) {
  db = fs; setSignedIn(true, false);
  picked = false; dirty = false; reports = new Map(); state = clone(DEFAULT);
  render(); syncForm(); updateHist();
  setStatus('Loading saved reports…');
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => setStatus('Could not reach saved reports yet. Showing the last report on this page.', true), 10000);
  const ref = db.ref('reports').orderByKey().limitToLast(90);
  const cb = snap => {
    const docs = [];
    snap.forEach(c => { docs.push({ id: c.key, data: () => c.val() }); });
    docs.reverse();
    onList({ docs, metadata: { fromCache: false, hasPendingWrites: false } });
  };
  const eb = e => {
    clearTimeout(loadTimer);
    setStatus(/permission/i.test((e && (e.code || e.message)) || '') ? 'This account is not allowed to read the reports. Check the rules in Firebase.' : 'Saved reports could not be loaded.', true);
  };
  ref.on('value', cb, eb);
  unsub = () => ref.off('value', cb);
}
function stopCloud() {
  if (unsub) { unsub(); unsub = null; }
  db = null; reports = new Map(); clearTimeout(loadTimer); setStatus('');
  setSignedIn(false, false);
}

$('btn-export').addEventListener('click', async () => {
  const out = {};
  reports.forEach((v, k) => { out[k] = v; });
  if (!Object.keys(out).length) { setStatus('There are no saved reports to back up yet.'); return; }
  const blob = new Blob([JSON.stringify({ app: 'leepang2-daily-report', exportedAt: new Date().toISOString(), reports: out }, null, 2)], { type: 'application/json' });
  try { await dl.save({ filename: 'leepang2-reports-backup-' + new Date().toISOString().slice(0, 10) + '.json', data: blob }); setStatus('Backup saved'); }
  catch (e) { if (!(e && e.code === 'declined')) setStatus('Could not save the backup.', true); }
});
$('btn-import').addEventListener('click', () => $('f-import').click());
$('f-import').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const j = JSON.parse(await file.text()), srcs = j && j.reports ? j.reports : j;
    let n = 0;
    for (const [k, v] of Object.entries(srcs)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !v || typeof v !== 'object') continue;
      const doc = Object.assign({}, v, { date: k });
      if (db) await db.ref('reports/' + k).set(doc);
      else { let m = {}; try { m = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (x) {} m[k] = doc; localStorage.setItem(LS, JSON.stringify(m)); }
      reports.set(k, doc); n++;
    }
    updateHist();
    setStatus(n ? 'Imported ' + n + ' report' + (n === 1 ? '' : 's') : 'No reports found in that file.', !n);
  } catch (err) { setStatus('Could not import that file.', true); }
});

(function boot() {
  const cfg = window.FIREBASE_CONFIG || {};
  if (cfg.openAccess && cfg.databaseURL && !/PASTE/.test(cfg.databaseURL)) {
    if (!window.firebase) { startLocal('Could not load Firebase. Data is saved on this device only.'); return; }
    firebase.initializeApp({ databaseURL: cfg.databaseURL, projectId: cfg.projectId });
    startCloud(firebase.database());
    $('btn-out').hidden = true;
    return;
  }
  const configured = !!(cfg.apiKey && cfg.projectId && !/^PASTE/.test(cfg.apiKey));
  if (!configured) { startLocal('Firebase is not set up yet, so data is saved on this device only. See README.md.'); return; }
  if (!window.firebase) { startLocal('Could not load Firebase. Data is saved on this device only.'); return; }
  $('layout').hidden = true; $('hist').hidden = true;
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), fs = firebase.database();
  auth.onAuthStateChanged(u => { if (u) startCloud(fs); else stopCloud(); });
  $('btn-out').addEventListener('click', () => auth.signOut());
  $('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('login-go'), msg = $('login-msg');
    btn.disabled = true; msg.textContent = '';
    try {
      await auth.signInWithEmailAndPassword($('login-email').value.trim(), $('login-pass').value);
      $('login-pass').value = '';
    } catch (err) {
      const c = (err && err.code) || '';
      msg.textContent = /invalid|wrong-password|user-not-found/.test(c) ? 'Wrong email or password.'
        : c === 'auth/too-many-requests' ? 'Too many tries. Wait a few minutes and try again.'
        : c === 'auth/network-request-failed' ? 'No connection. Check the internet and try again.'
        : 'Could not sign in.';
    } finally { btn.disabled = false; }
  });
})();
</script>
